services:
  # ── Backend API ──────────────────────────────────────────
  - type: web
    name: fizzup-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard

  # ── Frontend ─────────────────────────────────────────────
  - type: web
    name: fizzup-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to your backend URL e.g. https://fizzup-backend.onrender.com
